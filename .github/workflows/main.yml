name: Run Python Script

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

# Never let two runs overlap in the same Facebook session.
concurrency:
  group: fb-session
  cancel-in-progress: false

permissions:
  contents: write # monthly heartbeat commit only

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore Facebook session
        env:
          FB_COOKIES_B64: ${{ secrets.FB_COOKIES_B64 }}
        run: |
          if [ -z "$FB_COOKIES_B64" ]; then
            echo "FB_COOKIES_B64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$FB_COOKIES_B64" | base64 -d > cookies.pkl

      - name: Run Python script
        run: |
          sudo Xvfb :99 -ac &
          export DISPLAY=:99
          python main.py

      # Public repos have scheduled workflows auto-disabled after 60 days with no
      # repository activity. One tiny commit a month keeps the schedule alive.
      - name: Monthly heartbeat
        if: success()
        run: |
          TODAY=$(date -u +%F)
          [ "$(cat .heartbeat 2>/dev/null)" = "$TODAY" ] && exit 0
          [ "$(date -u +%d)" = "01" ] || exit 0
          echo "$TODAY" > .heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .heartbeat
          git commit -m "chore: monthly heartbeat [skip ci]"
          git push
